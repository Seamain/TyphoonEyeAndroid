AutoName: 台风眼
Description: |-
  TyphoonEye is a lightweight, open-source real-time typhoon tracking and
  weather alert application for Android.

  Features:
  * Live typhoon tracking with interactive MapLibre map rendering
  * Historical track, forecast path, and multi-quadrant wind radii
  * Optional distance-based emergency alerts (location permission)
  * Material Design 3, dynamic color, and multiple languages
  * Works offline with cached or bundled demo data when no API keys are set

  Network services (NonFreeNet):
  Live meteorological data may be fetched from third-party weather APIs
  (e.g. Juhe / QWeather) when the builder or user supplies keys. Optional
  mainland China basemap tiles may use Amap. Without keys the app still runs
  in demo / cache mode. No analytics or ads.

  F-Droid builds disable GitHub sideload updates; please update through
  F-Droid.

